name: Refresh dependency lock

on:
  push:
    branches:
      - chore/dependency-refresh-2026-08

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-refresh-2026-08
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock
        run: npm install --package-lock-only

      - name: Commit package-lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore(deps): regenerate canonical npm lockfile [skip ci]"
            git push origin HEAD:chore/dependency-refresh-2026-08
          fi
