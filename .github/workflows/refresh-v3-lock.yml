name: Refresh v3 lock

on:
  push:
    branches:
      - feat/fiscalizacao-matrix-fulltext-search-2026-10

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/fiscalizacao-matrix-fulltext-search-2026-10
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh package-lock
        run: npm install --package-lock-only

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore(release): refresh v3 lockfile [skip ci]"
            git push origin HEAD:feat/fiscalizacao-matrix-fulltext-search-2026-10
          fi
